[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-crypto"
version = "0.1.0"
description = "Machine learning pipeline for crypto data"
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.1",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "pyyaml==6.0.1",
    "scipy==1.12.0",
    "dvc==3.48.0",
    "pyarrow==15.0.0",
    "scikit-learn==1.4.1.post1",
    "lightgbm==4.3.0",
    "joblib==1.3.2",
    "fastapi==0.110.0",
    "uvicorn[standard]==0.28.0",
    "requests==2.31.0",
    "streamlit==1.32.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"